<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let PX,W,H;
function rs(){PX=Math.max(2,Math.round(Math.min(innerWidth,innerHeight)/170));W=Math.ceil(innerWidth/PX);H=Math.ceil(innerHeight/PX);cv.width=W;cv.height=H;cv.style.width=W*PX+'px';cv.style.height=H*PX+'px';ctx.imageSmoothingEnabled=false}
addEventListener('resize',rs);rs();

// ---------- Pixel sprite (burgundy polo, dark trousers, black sandals) ----------
const C={hair:'#1b1613',skin:'#c99a78',sk2:'#a67a5d',sh:'#7a1228',shD:'#560b1c',shL:'#92213a',tee:'#eee9e0',pa:'#2c2c2f',paD:'#1d1d20',sock:'#1b1b1d',sand:'#101010',sole:'#d9d0bd',eye:'#150e0b'};
// ---------- 16-bit superqahramon sprayti: qismli rig + avtomatik 3 tonli soya + kontur ----------
const SW=30,SH=39;
const RP={suit:['#b83a58','#8e1c3a','#64102b','#400a1c'],cape:['#e8566a','#c02a45','#8c1a34','#5a0f24'],skin:['#e6b998','#c99a78','#a2705a','#7a5040'],hair:['#4a3c35','#2a211d','#17110f','#0b0807'],pant:['#555560','#34343a','#222226','#141418'],boot:['#58586a','#2e2e38','#1a1a22','#0e0e14'],mask:['#3a3050','#1f1830','#130d1e','#0a0612']};
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const rd=Math.round;
const sR=(g,x,y,w,h,dx=0,dy=0)=>g.fillRect(rd(x)+dx,rd(y)+dy,w,h);
const sL=(g,x1,y1,x2,y2,t,dx=0,dy=0)=>{const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),1)*2;for(let i=0;i<=n;i++)g.fillRect(rd(x1+(x2-x1)*i/n)+dx,rd(y1+(y2-y1)*i/n)+dy,t,t)};
const sE=(g,cx,cy,rx,ry,dx=0,dy=0)=>{cx=rd(cx);cy=rd(cy);for(let y=-ry;y<=ry;y++){const w=rd(rx*Math.sqrt(1-y*y/(ry*ry+.01)));g.fillRect(cx-w+dx,cy+y+dy,w*2+1,1)}};
const sP=(g,pp,dx=0,dy=0)=>{const q=pp.map(p=>[rd(p[0]),rd(p[1])]);let a=1e9,b=-1e9;q.forEach(p=>{a=Math.min(a,p[1]);b=Math.max(b,p[1])});
  for(let y=a;y<=b;y++){const xs=[];for(let i=0;i<q.length;i++){const p=q[i],r=q[(i+1)%q.length];if((p[1]<=y&&r[1]>y)||(r[1]<=y&&p[1]>y))xs.push(p[0]+(y-p[1])/(r[1]-p[1])*(r[0]-p[0]))}
    xs.sort((m,n)=>m-n);for(let i=0;i+1<xs.length;i+=2)g.fillRect(rd(xs[i])+dx,y+dy,Math.max(1,rd(xs[i+1])-rd(xs[i])),1)}};
function shade(S,ramp,k,draw){
  const A=mkc(SW,SH),a=A.getContext('2d');a.fillStyle=ramp[2];draw(a,0,0);
  a.globalCompositeOperation='source-atop';a.fillStyle=ramp[1];draw(a,-k,-k);
  const B=mkc(SW,SH),b=B.getContext('2d');b.fillStyle=ramp[0];draw(b,0,0);b.globalCompositeOperation='destination-out';draw(b,k,k);
  a.drawImage(B,0,0);S.drawImage(A,0,0)}
function outline(src){const o=mkc(SW,SH),g=o.getContext('2d');[[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y])=>g.drawImage(src,x,y));
  g.globalCompositeOperation='source-in';g.fillStyle='#120a14';g.fillRect(0,0,SW,SH);g.globalCompositeOperation='source-over';g.drawImage(src,0,0);return o}
const AR=[[[[-3,5,-1,2],[3,5,6,1]],[[5,2,10,2],[3,5,6,1]],[[3,4,6,2],[3,5,6,1]]],
 [[[3,5,6,1],[-3,5,-1,3]],[[-3,6,0,4],[5,3,11,3]],[[3,5,6,1],[3,4,6,3]]],
 [[[2,5,5,1],[-3,6,0,4]],[[-3,6,0,4],[3,5,6,2]],[[2,5,5,1],[-3,6,0,4]]]];
const LN=[[0,3,2],[0,4,2],[0,-1,0]];
const LG=[[[[.35,.2],[-.35,.1]],[[.7,.6],[-.55,.1]],[[.45,.3],[-.4,.1]]],
 [[[.35,.2],[-.35,.1]],[[.75,.6],[-.6,.1]],[[.45,.3],[-.4,.1]]],
 [[[1.1,1.4],[-.15,.1]],[[1.35,.05],[-.15,.1]],[[.7,.8],[-.15,.1]]]];
const RPE={...RP,suit:['#6a4a9a','#4a2f78','#321e58','#1e1238'],pant:['#2a2a38','#1c1c28','#12121c','#0a0a12'],boot:['#3a3a48','#22222e','#14141c','#0a0a10'],skin:['#c8c8d8','#a8a8bc','#80809a','#5a5a74'],hair:['#4a3a6a','#2e2248','#1a1230','#0e0a1c']};
const RPJ={...RP,suit:['#9aa8b0','#74858f','#55656f','#3a4852'],pant:['#3a4048','#2a3038','#1e242a','#141a20'],boot:['#5a5a64','#34343e','#20202a','#12121a']},BKP=['#3a3a44','#1c1c24','#101018','#08080c'];
let MKR=null;
function mk(d,f,cv){
  const o=mkc(SW,SH),S=o.getContext('2d'),run=f<6,atk=f>=8?f-8:-1,an=atk<0?-1:atk/3|0,p3=atk<0?0:atk%3,ph=f*Math.PI/3,sn=Math.sin,cs=Math.cos,R=MKR||(cv==3?RPE:cv==2?RPJ:RP),far=r=>r.slice(1),pt=(r,k,fn)=>shade(S,r,k,fn);
  const fl=(c,fn)=>{S.fillStyle=c;fn()},W='#f3ecd8',GO='#e8b84a',SO='#d9d0bd';
  const glove=(x,y,r)=>cv?0:pt(r,1,(g,dx,dy)=>sR(g,x-1,y-1,4,4,dx,dy));
  if(d>=3){
    const bk=d==4,cx=15,xs=.6,lean=run?2:atk>=0?rd(LN[an][p3]*.6):1;
    const leg=(off,nr)=>{const q=atk>=0?LG[an][p3][nr?0:1]:0,th=run?.85*sn(ph+off):atk>=0?q[0]:(nr?.28:-.28),f2=run?.3+.45*sn(ph+off-1.6)+.15:atk>=0?q[1]:.12,kx=6*xs*sn(th),ky=6*cs(th);return{kx,ky,ax:kx+6*xs*sn(th-f2),ay:ky+6*cs(th-f2)}};
    const l1=leg(0,1),l2=leg(Math.PI,0),hx=cx,hy=rd(34-Math.max(l1.ay,l2.ay)),sx=hx+lean,sy=hy-10,hX=sx+1,hY=sy-5;
    const dLeg=(l,r,so,ox)=>{const x0=hx+ox;pt(r.pant,1,(g,x,y)=>{sL(g,x0,hy,x0+l.kx,hy+l.ky,4,x,y);sL(g,x0+l.kx,hy+l.ky,x0+l.ax,hy+l.ay,3,x,y)});
