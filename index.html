<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pixel Sayohat</title>
<style>
:root{--bg:#1d2a1f;--fg:#fff;--sat:0px;--sab:0px;--sal:0px;--sar:0px;--u:54px;--vw:100vw;--vh:100vh}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;font-family:ui-monospace,Menlo,monospace;user-select:none;-webkit-user-select:none}
#c{position:fixed;left:0;top:0;image-rendering:pixelated}
#hud{position:fixed;left:12px;top:calc(var(--sat) + 10px);color:var(--fg);font-size:15px;text-shadow:0 2px 0 #000;pointer-events:none}
#msg{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 14px);text-align:center;color:#fff;font-size:12px;opacity:.8;text-shadow:0 1px 0 #000;pointer-events:none}
#jb,#jk{position:fixed;border-radius:50%;display:none;pointer-events:none}
#jb{width:90px;height:90px;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
#jk{width:40px;height:40px;background:rgba(255,255,255,.6)}
#run{position:fixed;right:18px;bottom:calc(var(--sab) + 40px);width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:rgba(122,18,40,.7);color:#fff;font:700 12px ui-monospace,monospace}
#mute{position:fixed;right:12px;top:calc(var(--sat) + 8px);width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);font-size:18px;color:#fff;padding:0}
#atk{position:fixed;right:18px;bottom:calc(var(--sab) + 112px);width:76px;height:76px;border-radius:50%;border:3px solid #ffe27a;background:rgba(224,74,58,.8);color:#fff;font:700 13px ui-monospace,monospace}
#atk:active{background:#ff7a3a}
#mm{position:fixed;right:10px;top:calc(var(--sat) + 56px);image-rendering:pixelated;border:2px solid rgba(255,255,255,.55);border-radius:4px;background:rgba(10,20,14,.55);pointer-events:none}
#rn{position:fixed;right:58px;top:calc(var(--sat) + 8px);width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);font-size:18px;color:#fff;padding:0}
#fd{position:fixed;right:94px;bottom:calc(var(--sab) + 44px);width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:rgba(60,150,80,.75);font-size:22px;color:#fff;padding:0}
#tf{position:fixed;right:94px;bottom:calc(var(--sab) + 108px);width:56px;height:56px;border-radius:50%;border:3px solid #ffe27a;background:rgba(40,60,200,.75);font-size:24px;color:#fff;padding:0}
#hud2{position:fixed;left:12px;top:calc(var(--sat) + 34px);color:#8fe4ff;font-size:12px;text-shadow:0 2px 0 #000;pointer-events:none}
#dlg{position:fixed;left:50%;bottom:calc(var(--sab) + 150px);transform:translateX(-50%);display:none;gap:6px;flex-wrap:wrap;justify-content:center;width:270px}
#dlg button{font:700 12px ui-monospace,monospace;padding:8px 10px;border-radius:10px;border:2px solid #fff;background:rgba(30,50,90,.88);color:#fff}
#tk{position:fixed;right:156px;bottom:calc(var(--sab) + 44px);width:56px;height:56px;border-radius:50%;border:3px solid #8fe4ff;background:rgba(20,110,140,.8);font-size:22px;color:#fff;padding:0}
#bars{position:fixed;left:12px;bottom:calc(var(--sab) + 14px);width:120px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.bar{position:relative;height:9px;background:rgba(0,0,0,.55);border:1px solid #fff;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#e04a4a}#pwf{background:#ffd23a}
.bar b{position:absolute;left:3px;top:-3px;font-size:9px;font-weight:400}
#fy{position:fixed;right:18px;bottom:calc(var(--sab) + 196px);width:56px;height:56px;border-radius:50%;border:3px solid #9fe0ff;background:rgba(40,110,200,.75);font-size:24px;color:#fff;padding:0}
#bl{position:fixed;right:156px;bottom:calc(var(--sab) + 108px);width:56px;height:56px;border-radius:50%;border:3px solid #ffb030;background:rgba(220,110,20,.8);font-size:24px;color:#fff;padding:0}
#rgb{position:fixed;left:50%;top:calc(var(--sat) + 96px);transform:translate(-50%,-8px);opacity:0;transition:opacity .6s,transform .6s;pointer-events:none;text-align:center;z-index:6;font-family:monospace;color:#fff;text-shadow:0 2px 4px #000,0 0 10px #000}#rgb.on{opacity:1;transform:translate(-50%,0)}#rgb b{display:block;font-size:20px;letter-spacing:1px}#rgb small{display:block;font-size:11px;opacity:.85;margin-top:2px}
#bt,#dv,#uu,#ud{position:fixed;display:none;width:52px;height:52px;border-radius:50%;border:3px solid #9fe8ff;background:rgba(20,90,150,.8);font-size:22px;color:#fff;padding:0;z-index:5}
#bt{left:14px;bottom:calc(var(--sab) + 200px)}#dv{left:14px;bottom:calc(var(--sab) + 262px)}
#uu{left:76px;bottom:calc(var(--sab) + 262px)}#ud{left:76px;bottom:calc(var(--sab) + 200px)}
#swb{position:fixed;display:none;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 52px);width:200px;font:bold 11px monospace;color:#e6f8ff;text-align:center;text-shadow:0 1px 2px #000;pointer-events:none;z-index:5}
#swb i{display:block;height:7px;margin-top:3px;border-radius:4px;background:rgba(0,0,0,.45);border:1px solid #fff;overflow:hidden}#swb i b{display:block;height:100%;width:100%;background:#5ad0a0}
#mp{position:fixed;right:104px;top:calc(var(--sat) + 8px);width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);font-size:18px;color:#fff;padding:0}
#mps{position:fixed;right:10px;top:calc(var(--sat) + 170px);display:none;flex-direction:column;gap:5px;width:150px;padding:8px;border-radius:10px;background:rgba(10,20,30,.92);border:2px solid #fff;color:#fff;font-size:11px;z-index:5}
#mps button{font:700 11px ui-monospace,monospace;padding:6px;border-radius:8px;border:2px solid #888;background:rgba(30,50,90,.9);color:#fff}
#mps button.on{border-color:#ffe27a;background:rgba(90,70,20,.9)}#mps small{opacity:.7}
#run.on{background:#c42a4d}
#gm{position:fixed;inset:0;display:none;background:#02050c;z-index:50;touch-action:none}#gc{display:block;width:100%;height:100%;touch-action:none}
#gm button{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(20,40,80,.85);color:#fff;font-size:18px;padding:0}
#gx{right:12px;top:calc(var(--sat) + 10px)}#gs{right:12px;top:calc(var(--sat) + 64px)}#gsun{right:12px;top:calc(var(--sat) + 118px)}#sp{position:absolute;left:10px;bottom:14px;display:none;gap:6px;flex-wrap:wrap;max-width:calc(100% - 80px)}#gm #sp button{position:static;width:auto;height:38px;border-radius:19px;padding:0 12px;font-size:14px}#gm #sp button.on{background:#c98a10}#gp{right:12px;bottom:90px}#gq{right:12px;bottom:36px}
#ed0{position:fixed;right:152px;top:calc(var(--sat) + 8px);width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);font-size:18px;color:#fff;padding:0}
#ed{position:fixed;inset:0;display:none;background:#0b1220;z-index:60;touch-action:none;color:#fff;font:12px ui-monospace,monospace;user-select:none}#ec{display:block;width:100%;height:100%;touch-action:none}
#eb{position:absolute;left:10px;top:8px;font-size:13px;pointer-events:none}
#ea{position:absolute;left:0;right:0;top:34px;display:flex;gap:5px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
#ea button,#es button{flex:none;height:30px;padding:0 9px;border-radius:15px;border:2px solid #fff;background:rgba(20,40,80,.9);color:#fff;font:700 12px ui-monospace,monospace}
#ea button.on,#es button.on,#ep button.on{border-color:#ffe27a;background:rgba(110,80,20,.95)}
#es{position:absolute;left:0;right:0;bottom:58px;display:flex;gap:8px;align-items:center;padding:6px 10px;background:rgba(10,20,40,.85)}
#es input{flex:1;max-width:220px}
#ep{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;gap:5px;padding:5px 8px;overflow-x:auto;background:rgba(10,20,40,.92);scrollbar-width:none}
#ep button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;border-radius:8px;border:2px solid #667;background:rgba(30,50,90,.9);color:#fff;font:700 10px ui-monospace,monospace}
#ep i{display:block;width:22px;height:10px;border:1px solid #fff;border-radius:2px}
#ecd{position:absolute;inset:60px 12px auto 12px;display:none;flex-direction:column;gap:6px;background:rgba(10,20,40,.97);border:2px solid #fff;border-radius:10px;padding:10px;z-index:3}
#ecd textarea{height:140px;background:#000;color:#9f9;font:10px ui-monospace,monospace;border:1px solid #567;word-break:break-all}
#ecd div{display:flex;gap:6px}#ecd button{flex:1;height:32px;border-radius:8px;border:2px solid #fff;background:rgba(30,60,110,.95);color:#fff;font:700 12px ui-monospace,monospace}
#etoast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid #fff;border-radius:8px;padding:6px 12px;opacity:0;transition:opacity .3s;pointer-events:none}
/* ===== gorizontal maket: har qanday ekranga moslashadi (--u = tugma o'lchami) ===== */
html,body{background:#0d140f}
#root{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0;background:#16221a}
#sap{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#tbar{position:fixed;right:calc(var(--sar) + 8px);top:calc(var(--sat) + 6px);display:flex;gap:calc(var(--u)*.1);z-index:6}
#root #tbar>button{position:static;width:calc(var(--u)*.74);height:calc(var(--u)*.74);font-size:calc(var(--u)*.34);border-width:2px;padding:0;flex:none}
#bed0{background:rgba(190,120,30,.9);border:2px solid #fff;border-radius:50%;color:#fff}
#rbtn{position:fixed;right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 8px);display:grid;grid-template-columns:repeat(4,var(--u));grid-template-rows:repeat(3,var(--u));gap:calc(var(--u)*.1);z-index:5}
#root #rbtn>button{position:static;width:100%;height:100%;min-width:0;padding:0;font-size:calc(var(--u)*.4);border-width:3px}
#root #rbtn #bl{grid-area:1/1}#root #rbtn #tf{grid-area:1/2}#root #rbtn #fy{grid-area:1/3}#root #rbtn #fd{grid-area:1/4}
#root #rbtn #bd{grid-area:2/1}#root #rbtn #sx{grid-area:2/2}
#root #rbtn #atk{grid-area:2/3/4/5;font-size:calc(var(--u)*.3)}
#root #rbtn #run{grid-area:3/1/4/3;border-radius:999px;font-size:calc(var(--u)*.26)}
#root #hud{left:calc(var(--sal) + 10px);top:calc(var(--sat) + 6px);font-size:calc(var(--u)*.25);max-width:calc(var(--vw) - var(--u)*6.8)}
#root #hud2{left:calc(var(--sal) + 10px);top:calc(var(--sat) + var(--u)*.5 + 8px);font-size:calc(var(--u)*.21)}
#root #bars{left:calc(var(--sal) + 10px);bottom:calc(var(--sab) + 10px);width:calc(var(--u)*2.6)}
#root #msg{left:0;right:0;bottom:calc(var(--sab) + 2px);font-size:calc(var(--u)*.2);padding:0 calc(var(--u)*5.2) 0 calc(var(--u)*3.2);animation:hf 1.2s 14s forwards}
@keyframes hf{to{opacity:0}}
#root #mm{top:calc(var(--sat) + var(--u)*.74 + 14px);right:calc(var(--sar) + 8px);width:calc(var(--u)*2.7)!important;height:auto!important}
#root #mps{top:calc(var(--sat) + var(--u)*.74 + 14px);right:calc(var(--sar) + 8px);max-height:calc(var(--vh) - var(--u)*1.2);overflow:auto}
#root #bt,#root #dv,#root #uu,#root #ud{width:calc(var(--u)*.85);height:calc(var(--u)*.85)}
#root #bt{left:calc(var(--sal) + 10px);bottom:calc(var(--sab) + 44px)}#root #ud{left:calc(var(--sal) + 10px + var(--u)*.95);bottom:calc(var(--sab) + 44px)}
#root #dv{left:calc(var(--sal) + 10px);bottom:calc(var(--sab) + 44px + var(--u)*.95)}#root #uu{left:calc(var(--sal) + 10px + var(--u)*.95);bottom:calc(var(--sab) + 44px + var(--u)*.95)}
#root #dlg{bottom:calc(var(--sab) + 10px)}
#root #rgb{top:calc(var(--sat) + var(--u)*.95)}
#root #swb{top:calc(var(--sat) + var(--u)*.95 + 30px)}
#root #bbar{left:calc(var(--sal) + var(--u)*3);right:calc(var(--sar) + var(--u)*5);bottom:calc(var(--sab) + 8px);top:auto;max-width:none;margin:0;padding:4px}
#root #bbar button,#root #bpal button{min-width:calc(var(--u)*1.05);height:calc(var(--u)*1.05);font-size:calc(var(--u)*.19)}
#root #bbar button b,#root #bpal button b{font-size:calc(var(--u)*.38)}
#bbar button.bedb{border-color:#ffb030}
#root #ivp{width:min(calc(var(--vw)*.94),580px);max-height:calc(var(--vh)*.92)}
/* ===== qurish tahriri ===== */
#be{position:absolute;left:0;top:0;right:0;bottom:0;display:none;background:#0e141a;z-index:58;touch-action:none;color:#fff;font-family:ui-monospace,Menlo,monospace;user-select:none}
#bc{position:absolute;left:0;top:0;image-rendering:pixelated;touch-action:none}
#bi{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 6px);background:rgba(10,16,24,.74);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 9px;pointer-events:none;font-size:calc(var(--u)*.24);line-height:1.4;max-width:calc(var(--vw)*.55)}
#bt2{position:absolute;right:calc(var(--sar) + 8px);top:calc(var(--sat) + 6px);display:grid;grid-template-columns:repeat(2,calc(var(--u)*.8));gap:calc(var(--u)*.1)}
#bt2 button{height:calc(var(--u)*.8);border-radius:calc(var(--u)*.2);border:2px solid #fff;background:rgba(20,40,80,.9);color:#fff;font-family:ui-monospace,monospace;font-weight:700;font-size:calc(var(--u)*.25);padding:0}
#bt2 button.on{border-color:#ffe27a;background:rgba(110,80,20,.95)}
#bpal{position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);bottom:calc(var(--sab) + 6px);display:flex;gap:5px;overflow-x:auto;padding:5px;background:rgba(10,14,24,.84);border:2px solid #ffe27a;border-radius:12px;scrollbar-width:none;touch-action:pan-x}
#bpal button{flex:0 0 auto;border-radius:10px;border:2px solid #556;background:#1c2436;color:#fff;font-family:ui-monospace,monospace;padding:2px 4px;line-height:1.15}
#bpal button b{display:block}
#bpal button.on{border-color:#ffe27a;background:#4a3a10}#bpal button.no{opacity:.45}#bpal button.fut{border-color:#3ac0ff}
#bto{position:absolute;left:50%;top:calc(var(--sat) + var(--u)*1.2);transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid #fff;border-radius:8px;padding:6px 12px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:calc(var(--u)*.26);text-align:center;max-width:60%;z-index:3}

/* ===== YANGI UI: shisha (glass) uslubi, SVG ikonkalar ===== */
:root{--glass:linear-gradient(180deg,rgba(44,54,74,.55),rgba(12,16,26,.6));--ln:rgba(255,255,255,.24);--sh:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -10px 16px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.32)}
/* ikonka tugmalar */
#root :is(#mute,#rn,#mp,#ed0,#bed0,#iv,#tk,#bl,#tf,#fy,#fd,#bd,#sx){position:relative!important;inset:auto!important}
#root :is(#mute,#rn,#mp,#ed0,#bed0,#iv,#tk,#bl,#tf,#fy,#fd,#bd,#sx,#bt,#dv,#uu,#ud){
 font-size:0!important;color:transparent!important;background:var(--glass)!important;border:1.5px solid var(--ln)!important;box-shadow:var(--sh)!important;
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:0!important;transition:transform .08s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
#root :is(#mute,#rn,#mp,#ed0,#bed0,#iv,#tk){border-radius:30%!important}
#root :is(#bl,#tf,#fy,#fd,#bd,#sx,#bt,#dv,#uu,#ud){border-radius:50%!important}
#root :is(#mute,#rn,#mp,#ed0,#bed0,#iv,#tk,#bl,#tf,#fy,#fd,#bd,#sx,#bt,#dv,#uu,#ud)::before{content:"";position:absolute;inset:0;margin:auto;width:52%;height:52%;background:var(--ac,#fff);
 -webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}
#root :is(#mute,#rn,#mp,#ed0,#bed0,#iv,#tk,#bl,#tf,#fy,#fd,#bd,#sx,#bt,#dv,#uu,#ud):active{transform:scale(.9);background:linear-gradient(180deg,rgba(80,96,128,.7),rgba(30,38,58,.7))!important}
#mute{--m:var(--i-snd);--ac:#e8f1ff}#mute[data-off]{--m:var(--i-mute);--ac:#ff8a8a}
#rn{--m:var(--i-rain);--ac:#9fd4ff}#mp{--m:var(--i-map);--ac:#8fe8b0}#ed0{--m:var(--i-pen);--ac:#ffd86b}#bed0{--m:var(--i-cube);--ac:#ffb35a}
#iv{--m:var(--i-bag);--ac:#c8a8ff}#tk{--m:var(--i-chat);--ac:#7fe6f5}
#bl{--m:var(--i-fire);--ac:#ffa045}#tf{--m:var(--i-bolt);--ac:#ffe14d}#fy{--m:var(--i-wing);--ac:#8fd8ff}#fd{--m:var(--i-apple);--ac:#7be08a}
#bd{--m:var(--i-hammer);--ac:#e8b07a}#sx{--m:var(--i-star);--ac:#ff7f7f}
#bt{--m:var(--i-boat);--ac:#9fe8ff}#dv{--m:var(--i-dive);--ac:#9fe8ff}#uu{--m:var(--i-up);--ac:#9fe8ff}#ud{--m:var(--i-down);--ac:#9fe8ff}
/* tugma ostidagi rangli yorug' halqa (har funksiya o'z rangida) */
#root :is(#bl,#tf,#fy,#fd,#bd,#sx){border-color:color-mix(in srgb,var(--ac) 55%,transparent)!important}
#root #bd.on{background:linear-gradient(180deg,rgba(200,140,40,.75),rgba(110,70,10,.75))!important;border-color:#ffe27a!important}
/* yuqori panel */
#tbar{padding:calc(var(--u)*.07);border-radius:calc(var(--u)*.3);background:rgba(10,14,22,.34);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#root #mm{top:calc(var(--sat) + var(--u)*.74 + 24px);border-radius:calc(var(--u)*.16);border:1.5px solid var(--ln);box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:.92}
#root #mps{top:calc(var(--sat) + var(--u)*.74 + 24px)}
/* o'ng-past: harakat tugmalari */
#rbtn{grid-template-columns:repeat(4,calc(var(--u)*.84));grid-template-rows:repeat(3,calc(var(--u)*.84));gap:calc(var(--u)*.11)}
#root #rbtn #atk,#root #rbtn #run{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.04);font:700 calc(var(--u)*.2)/1 ui-monospace,Menlo,monospace!important;letter-spacing:.14em;color:#fff!important;border-width:1.5px!important;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s}
#root #rbtn #atk::before,#root #rbtn #run::before{content:"";flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#root #rbtn #atk{--m:var(--i-sword);border-radius:50%;border-color:rgba(255,214,150,.75)!important;background:radial-gradient(circle at 35% 28%,rgba(255,130,96,.88),rgba(190,36,40,.84) 62%,rgba(110,14,26,.86))!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -14px 22px rgba(60,0,0,.3),0 6px 18px rgba(120,0,0,.4)!important}
#root #rbtn #atk::before{width:calc(var(--u)*.62);height:calc(var(--u)*.62)}
#root #rbtn #atk:active{transform:scale(.94);filter:brightness(1.15)}
#root #rbtn #run{--m:var(--i-run);flex-direction:row;gap:calc(var(--u)*.1);border-radius:999px;border-color:var(--ln)!important;background:var(--glass)!important;box-shadow:var(--sh)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#root #rbtn #run::before{width:calc(var(--u)*.34);height:calc(var(--u)*.34)}
#root #rbtn #run:active{transform:scale(.95)}
#root #rbtn #run.on{background:linear-gradient(180deg,rgba(255,90,120,.75),rgba(150,20,60,.8))!important;border-color:#ffb3c4!important}
/* HUD paneli */
#root #hud{display:flex;align-items:center;gap:calc(var(--u)*.08);flex-wrap:nowrap;white-space:nowrap;padding:calc(var(--u)*.07) calc(var(--u)*.2);border-radius:999px;background:rgba(10,14,22,.5);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-shadow:none;font-size:calc(var(--u)*.2);font-weight:600;overflow:hidden;max-width:calc(var(--vw) - var(--u)*6.6)}
#hud .ico,.bar b::before{display:inline-block;width:1.15em;height:1.15em;flex:none;background:var(--ac,#fff);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;vertical-align:-.2em;margin-right:.2em}
#hud .sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4);margin:0 .35em;vertical-align:middle}
#root #hud2{top:calc(var(--sat) + var(--u)*.5 + 16px);padding:calc(var(--u)*.05) calc(var(--u)*.16);border-radius:calc(var(--u)*.16);background:rgba(10,14,22,.42);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-shadow:none;line-height:1.35;font-size:calc(var(--u)*.2)}
/* HP / quvvat */
#root #bars{gap:calc(var(--u)*.1);padding-left:calc(var(--u)*.34)}
#root .bar{height:calc(var(--u)*.15);border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(0,0,0,.5);overflow:visible;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#root .bar i{border-radius:999px;background:linear-gradient(180deg,#ff8080,#d63a3a)}
#root #pwf{background:linear-gradient(180deg,#ffe46a,#f0b000)}
#root .bar b{position:absolute;left:calc(var(--u)*-.31);top:50%;transform:translateY(-50%);font-size:0;width:calc(var(--u)*.24);height:calc(var(--u)*.24)}
#root .bar b::before{content:"";display:block;width:100%;height:100%;margin:0;vertical-align:baseline}
#root .bar:first-child b::before{--m:var(--i-heart);--ac:#ff6a6a;background:var(--ac)}
#root .bar:last-child b::before{--m:var(--i-bolt);--ac:#ffd84a;background:var(--ac)}
#root .bar b::before{-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
/* pastki yozuv va muloqot */
#root #msg{opacity:.55;text-shadow:0 1px 3px #000;font-size:calc(var(--u)*.18)}
#root #dlg button{border:1px solid var(--ln);background:var(--glass);border-radius:999px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:calc(var(--u)*.22);padding:calc(var(--u)*.14) calc(var(--u)*.3)}
#root #mps{border:1px solid var(--ln);border-radius:calc(var(--u)*.22);background:rgba(10,14,22,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#root #mps button{border:1px solid var(--ln);background:var(--glass);border-radius:calc(var(--u)*.15)}
#root #bbar,#root #bpal{border:1px solid var(--ln);border-radius:calc(var(--u)*.26);background:rgba(10,14,22,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#root #bbar button,#root #bpal button{border:1px solid var(--ln);border-radius:calc(var(--u)*.18);background:var(--glass)}
#root #bbar button.on,#root #bpal button.on{border-color:#ffe27a;background:linear-gradient(180deg,rgba(200,140,40,.6),rgba(100,64,10,.65))}
#root #bt2 button{border:1.5px solid var(--ln);background:var(--glass);box-shadow:var(--sh);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#root #bt2 button.on{border-color:#ffe27a;background:linear-gradient(180deg,rgba(200,140,40,.7),rgba(100,64,10,.75))}
/* vinyetka */
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 58%,rgba(6,10,6,.2) 100%)}
/* radar: yumaloq, shisha hoshiyali */
#root #mm{width:calc(var(--u)*2.3)!important;height:calc(var(--u)*2.3)!important;border-radius:50%!important;border:2px solid rgba(255,255,255,.4)!important;box-shadow:0 0 0 3px rgba(8,12,20,.45),0 6px 16px rgba(0,0,0,.45)!important;background:#101820!important;opacity:1!important}

/*UI-END*/

    const l1=leg(0,1),l2=leg(Math.PI,0),hx=cx,hy=rd(34-Math.max(l1.ay,l2.ay)),sx=hx+lean,sy=hy-10,hX=sx+1,hY=sy-5;

(function(){

  const cl=v=>v<0?0:v>255?255:v|0;

  const mix=(a,b,t)=>'rgb('+cl(a[0]+(b[0]-a[0])*t)+','+cl(a[1]+(b[1]-a[1])*t)+','+cl(a[2]+(b[2]-a[2])*t)+')';
  function paint(cv,base,kind,seed){
    const g=cv.getContext('2d'),c=hx(base);g.clearRect(0,0,32,16);
    let s=(seed*2654435761+12345)>>>0;const rn=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
    const J={grass:.05,sand:.04,snow:.025,rock:.06,path:.04,water:.03,ice:.025}[kind]||.06;
    const px=[];

      let k=1+(rn()-.5)*2*J;if(kind=='water')k+=(r-8)*.006;

    if(kind=='grass'){const lt=mul(c,1.32),dk=mul(c,.72),dd=mul(c,.6);
      for(let i=0;i<5;i++){const p=pick();dot(p,lt);dot([p[0],p[1]+1],dk)}
      for(let i=0;i<2;i++)dot(pick(),dd,2,1);
      if(rn()<.18){const p=pick();dot(p,rn()<.5?'#f2e9a0':'#f4f0ea')}}
    else if(kind=='sand'){const lt=mul(c,1.12),dk=mul(c,.88);

    else if(kind=='rock'){const lt=mul(c,1.2),dk=mul(c,.62);

    else if(kind=='ice'){const bl=mix(c,[130,180,220],.5);for(let i=0;i<5;i++)dot(pick(),bl,2,1);for(let i=0;i<4;i++)dot(pick(),'#ffffff')}}
  window.__paintTile=paint;
  // yangi, tabiiy palitra (o't, qum, qor, tosh)

    PL.forEach((a,b)=>a.forEach((cv,i)=>paint(cv,P[b][i],'path',b*11+i+40)));

  }catch(e){console.warn('ranglar',e)}
